<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANTIA ELITE PREDICTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #ffcc00; 
            --gold-gradient: linear-gradient(145deg, #ffcc00, #b8860b);
            --win: #00ff88; 
        }

        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.85)), 
                        url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?fit=crop&w=1200&q=80'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff; 
            font-family: 'Poppins', sans-serif; 
            margin: 0; text-align: center; min-height: 100vh;
        }

        /* BANDEAU ALERTE SONORE */
        #sound-notif {
            background: var(--gold-gradient);
            color: black;
            font-size: 10px;
            font-weight: bold;
            padding: 5px;
            cursor: pointer;
            display: block;
        }

        header { padding: 30px 15px; background: transparent; }
        .logo-bar {
            display: inline-block; padding: 10px 40px; border: 2px solid var(--gold);
            border-radius: 50px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
        }
        h1 { font-family: 'Cinzel', serif; color: var(--gold); margin: 0; font-size: 1.5em; letter-spacing: 5px; }

        .tabs { display: flex; justify-content: center; gap: 10px; padding: 15px 0; }
        .tab-btn { 
            background: rgba(0, 0, 0, 0.6); border: 1px solid #444; color: #bbb; 
            padding: 8px 18px; border-radius: 30px; font-size: 0.75em; cursor: pointer;
        }
        .tab-btn.active { background: var(--gold-gradient); color: black; font-weight: bold; }

        .container { padding: 20px; max-width: 450px; margin: 0 auto; }

        .match-card { 
            background: rgba(26, 26, 26, 0.7); border-radius: 20px; padding: 20px; margin-bottom: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1); position: relative; overflow: hidden;
            backdrop-filter: blur(15px); border-top: 2px solid var(--gold);
        }
        
        .type-badge { font-size: 10px; color: var(--gold); text-transform: uppercase; border: 1px solid var(--gold); padding: 2px 10px; border-radius: 5px; margin-bottom: 10px; display: inline-block; }
        .match-teams { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.3em; margin: 10px 0; display: block; }
        
        .prediction-box { background: rgba(255, 204, 0, 0.1); padding: 10px; border-radius: 10px; margin: 10px 0; border: 1px dashed var(--gold); }
        .prediction-text { color: var(--gold); font-weight: 600; font-size: 0.9em; }

        .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px; }
        .val { font-size: 1.4em; font-weight: 700; color: #fff; }
        .label { font-size: 0.6em; color: #aaa; text-transform: uppercase; }

        #admin-panel { display: none; background: rgba(0, 0, 0, 0.95); padding: 25px; border: 2px solid var(--gold); margin: 20px; border-radius: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid #444; color: white; border-radius: 10px; }
        .btn-add { background: var(--gold-gradient); color: black; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 10px; margin-top: 10px; }

        .email-fixed { position: fixed; bottom: 25px; right: 25px; background: var(--gold-gradient); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 24px; z-index: 1000; }
        .footer { color: rgba(255,255,255,0.2); font-size: 9px; margin: 60px 0; cursor: pointer; }
    </style>
</head>
<body>

    <div id="sound-notif" onclick="enableAudio()">🔴 CLIQUER ICI POUR ACTIVER LES ALERTES BANTIA</div>

    <header>
        <div class="logo-bar">
            <h1>𝐁𝐀𝐍𝐓𝐈𝐀☆𝑬𝑳𝑰𝑻𝑬</h1>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="btn-live" onclick="switchTab('live')">Analyses</button>
        <button class="tab-btn" id="btn-history" onclick="switchTab('history')">Archives</button>
    </div>

    <div class="container" id="liste-matchs">
        <p style="color: #ccc;">Initialisation...</p>
    </div>

    <div id="admin-panel" class="container">
        <h3 style="color: var(--gold);">ADMIN ZZ</h3>
        <input type="text" id="typePari" placeholder="Type (ex: Score Exact)">
        <input type="text" id="eq" placeholder="Match">
        <input type="text" id="time" placeholder="Heure">
        <input type="text" id="pronostic" placeholder="Pari Conseillé">
        <input type="text" id="ht" placeholder="Score HT">
        <input type="text" id="ft" placeholder="Score FT">
        <input type="text" id="conf" placeholder="Confiance %">
        <select id="status">
            <option value="en_cours">En cours</option>
            <option value="gagne">Gagné ✅</option>
        </select>
        <button class="btn-add" id="btn-publish" onclick="envoyerMatch()">PUBLIER MAINTENANT</button>
    </div>

    <a href="mailto:bantiaelite@gmail.com" class="email-fixed">✉️</a>
    <p class="footer" onclick="ouvrirAdmin()">© 2026 Bantia Elite |  ZZ</p>

    <audio id="zz-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrDehL-WzJP0jrw-i6iOTIXMNl9nrXOMI",
            authDomain: "bantiaapp.firebaseapp.com",
            projectId: "bantiaapp",
            storageBucket: "bantiaapp.firebasestorage.app",
            appId: "1:1017776145922:web:baa915ce6bf6196fc9c91b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentTab = 'live';
        let matchCount = -1; // Pour détecter les nouveaux ajouts

        // --- GESTION AUDIO ---
        window.enableAudio = () => {
            document.getElementById('zz-sound').play().then(() => {
                document.getElementById('zz-sound').pause();
                document.getElementById('sound-notif').style.display = 'none';
                alert("Alertes ZZ activées !");
            });
        };

        window.switchTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            chargerDonnees();
        };

        function chargerDonnees() {
            onSnapshot(query(collection(db, "matchs"), orderBy("timestamp", "desc")), (s) => {
                // Alerte sonore si un nouveau match arrive (seulement en mode live)
                if (matchCount !== -1 && s.size > matchCount && currentTab === 'live') {
                    document.getElementById('zz-sound').play();
                }
                matchCount = s.size;

                const div = document.getElementById("liste-matchs");
                div.innerHTML = "";
                s.forEach((match) => {
                    const m = match.data();
                    if(currentTab === 'live' && m.status === 'gagne') return;
                    if(currentTab === 'history' && m.status !== 'gagne') return;
                    div.innerHTML += `
                        <div class="match-card">
                            <div class="type-badge">${m.typePari || 'PRÉDICTION'}</div>
                            <span class="match-teams">${m.equipes}</span>
                            <div class="prediction-box">
                                <span class="prediction-text">${m.pronostic || 'En analyse...'}</span>
                            </div>
                            <div class="score-grid">
                                <div class="score-item"><span class="label">HT</span><br><span class="val">${m.ht || '-'}</span></div>
                                <div class="score-item"><span class="label">FT</span><br><span class="val">${m.ft || '-'}</span></div>
                            </div>
                            <button class="btn-del" style="display:none; color:red; border:1px solid #444; background:none; margin-top:15px; width:100%;" onclick="supprimer('${match.id}')">EFFACER</button>
                        </div>`;
                });
            });
        }

        window.ouvrirAdmin = () => {
            const t = prompt("Code :");
            if(btoa(t) === "NjU0MDkx") {
                document.getElementById('admin-panel').style.display = 'block';
                setTimeout(() => { document.querySelectorAll('.btn-del').forEach(b => b.style.display = 'block'); }, 500);
            }
        };

        window.envoyerMatch = async () => {
            try {
                await addDoc(collection(db, "matchs"), {
                    typePari: document.getElementById('typePari').value,
                    equipes: document.getElementById('eq').value,
                    heure: document.getElementById('time').value,
                    pronostic: document.getElementById('pronostic').value,
                    ht: document.getElementById('ht').value,
                    ft: document.getElementById('ft').value,
                    confiance: document.getElementById('conf').value,
                    status: document.getElementById('status').value,
                    timestamp: new Date()
                });
                alert("Propagé !");
            } catch (e) { alert("Erreur."); }
        };

        window.supprimer = async (id) => { 
            if(confirm("Supprimer ?")) await deleteDoc(doc(db, "matchs", id)); 
        };

        chargerDonnees();
    </script>
</body> 
</html>
